[package]
name = "superpowers-trae"
version = "0.2.2"
edition = "2021"
authors = ["xiaojin <amwtke@gmail.com>"]
description = "One-shot installer for the Superpowers methodology in Trae IDE projects"
license = "MIT"
readme = "README.md"
repository = "https://github.com/amwtke/superpowers-to-trae"

[package.metadata.upstream]
superpowers_version = "5.0.7"
ddd_run_version = "8cb30e0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
include_dir = { version = "0.7", features = ["glob"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
